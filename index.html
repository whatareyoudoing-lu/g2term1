<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Little Panda’s Adventure — 小熊猫的奇妙一天</title>
  <style>
    /* ==========================================================================
       1. BASE & RESET (Offline-ready, Kid-friendly Typography & Palette)
       ========================================================================== */
    :root {
      --bg-sky: #e0f4ff;
      --bg-cream: #fffdf7;
      --primary-orange: #ff9f1c;
      --primary-orange-dark: #e08200;
      --secondary-green: #2ec4b6;
      --secondary-green-dark: #1fa396;
      --accent-pink: #ff6b6b;
      --accent-yellow: #ffd166;
      --accent-purple: #8338ec;
      --text-dark: #2b2d42;
      --text-muted: #5c6378;
      --card-shadow: 0 10px 25px rgba(43, 45, 66, 0.12);
      --border-radius-lg: 24px;
      --border-radius-md: 16px;
    }

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: "Comic Sans MS", "Chalkboard SE", "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
      background: linear-gradient(180deg, #cbeeff 0%, #eaf8ff 60%, #d8f3dc 100%);
      color: var(--text-dark);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow-x: hidden;
    }

    /* ==========================================================================
       2. TOP NAVIGATION BAR (Progress, Pinyin Toggle, Sound Toggle)
       ========================================================================== */
    .top-bar {
      width: 100%;
      max-width: 1020px;
      padding: 12px 20px;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      z-index: 50;
    }

    .brand-badge {
      background: #ffffff;
      padding: 8px 16px;
      border-radius: 999px;
      font-weight: bold;
      font-size: 1rem;
      color: var(--text-dark);
      box-shadow: 0 4px 10px rgba(0,0,0,0.08);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .chapter-pills {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .pill {
      padding: 6px 14px;
      border-radius: 999px;
      font-size: 0.9rem;
      font-weight: bold;
      background: rgba(255, 255, 255, 0.7);
      color: var(--text-muted);
      border: 2px solid transparent;
      transition: all 0.3s ease;
    }

    .pill.active {
      background: var(--accent-yellow);
      color: var(--text-dark);
      border-color: var(--primary-orange);
      transform: scale(1.05);
    }

    .pill.done {
      background: #b7e4c7;
      color: #1b4332;
    }

    .controls-group {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .toggle-btn {
      background: #ffffff;
      border: 3px solid var(--secondary-green);
      color: var(--text-dark);
      padding: 8px 16px;
      border-radius: 999px;
      font-weight: bold;
      font-size: 0.95rem;
      cursor: pointer;
      box-shadow: 0 4px 0 var(--secondary-green-dark);
      transition: transform 0.1s, box-shadow 0.1s;
    }

    .toggle-btn:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 var(--secondary-green-dark);
    }

    .toggle-btn.off {
      border-color: #adb5bd;
      box-shadow: 0 4px 0 #6c757d;
      color: #6c757d;
    }

    /* ==========================================================================
       3. MAIN STAGE CONTAINER
       ========================================================================== */
    .game-container {
      width: 95%;
      max-width: 980px;
      background: var(--bg-cream);
      border-radius: var(--border-radius-lg);
      box-shadow: var(--card-shadow);
      border: 5px solid #ffffff;
      padding: 20px;
      margin-bottom: 24px;
      position: relative;
      min-height: 580px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    /* ==========================================================================
       4. PINYIN + HANZI RUBY DISPLAY
       ========================================================================== */
    .zh-phrase {
      display: inline-flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: flex-end;
      gap: 4px;
      line-height: 1.2;
    }

    .zh-word {
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      margin: 0 2px;
    }

    .pinyin-text {
      font-size: 0.95rem;
      font-weight: 600;
      color: #d94e34;
      letter-spacing: 0.5px;
      min-height: 1.2em;
      transition: opacity 0.2s ease, visibility 0.2s ease;
    }

    body.hide-pinyin .pinyin-text {
      opacity: 0;
      visibility: hidden;
    }

    .hanzi-text {
      font-size: 1.75rem;
      font-weight: 800;
      color: var(--text-dark);
    }

    .zh-large .pinyin-text { font-size: 1.15rem; }
    .zh-large .hanzi-text { font-size: 2.2rem; }

    .zh-small .pinyin-text { font-size: 0.85rem; }
    .zh-small .hanzi-text { font-size: 1.35rem; }

    /* ==========================================================================
       5. BUTTONS & INTERACTIVE CARDS
       ========================================================================== */
    .btn-primary {
      background: linear-gradient(180deg, #ffb703 0%, #fb8500 100%);
      color: #ffffff;
      border: none;
      padding: 14px 32px;
      font-size: 1.3rem;
      font-weight: 800;
      border-radius: 999px;
      cursor: pointer;
      box-shadow: 0 6px 0 #c96200, 0 10px 20px rgba(251, 133, 0, 0.3);
      transition: transform 0.12s, box-shadow 0.12s;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .btn-primary:hover {
      filter: brightness(1.05);
    }

    .btn-primary:active {
      transform: translateY(4px);
      box-shadow: 0 2px 0 #c96200;
    }

    .choice-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
      gap: 16px;
      width: 100%;
      margin-top: 14px;
    }

    .choice-card {
      background: #ffffff;
      border: 4px solid #dce8f2;
      border-radius: var(--border-radius-md);
      padding: 16px 14px;
      cursor: pointer;
      text-align: center;
      transition: all 0.2s ease;
      box-shadow: 0 5px 0 #cbd9e6;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 92px;
    }

    .choice-card:hover {
      border-color: var(--primary-orange);
      transform: translateY(-3px);
      box-shadow: 0 8px 0 #f4a261;
    }

    .choice-card:active {
      transform: translateY(2px);
      box-shadow: 0 2px 0 #cbd9e6;
    }

    .choice-card.correct {
      background: #d8f3dc;
      border-color: #2d6a4f;
      box-shadow: 0 5px 0 #2d6a4f;
      animation: popBounce 0.45s ease;
    }

    .choice-card.wrong {
      background: #ffe5ec;
      border-color: #e63946;
      box-shadow: 0 5px 0 #e63946;
      animation: shake 0.4s ease;
    }

    .choice-en {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--text-dark);
    }

    /* ==========================================================================
       6. CARTOON SCENE BACKGROUNDS & SVG ANIMATIONS
       ========================================================================== */
    .scene-box {
      width: 100%;
      border-radius: 20px;
      padding: 16px;
      position: relative;
      overflow: hidden;
      border: 3px solid rgba(0,0,0,0.06);
      margin-bottom: 12px;
    }

    .scene-classroom {
      background: linear-gradient(180deg, #fff3b0 0%, #ffe8a3 68%, #d4a373 68%, #bc8a5f 100%);
    }

    .scene-street {
      background: linear-gradient(180deg, #bde0fe 0%, #e0fbfc 65%, #95d5b2 65%, #74c69d 82%, #adb5bd 82%, #6c757d 100%);
    }

    .scene-sky {
      background: linear-gradient(180deg, #4cc9f0 0%, #90e0ef 55%, #caf0f8 75%, #80ed99 75%, #57cc99 100%);
    }

    .speech-bubble {
      background: #ffffff;
      border: 3px solid var(--text-dark);
      border-radius: 20px;
      padding: 12px 18px;
      position: relative;
      display: inline-block;
      box-shadow: 0 4px 10px rgba(0,0,0,0.08);
      max-width: 90%;
    }

    .instruction-banner {
      background: #edf6f9;
      border-left: 6px solid var(--secondary-green);
      padding: 10px 16px;
      border-radius: 12px;
      font-size: 1.08rem;
      font-weight: 700;
      color: #1d3557;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
    }

    /* Drag & Drop + Click-to-Select Items */
    .draggable-item {
      cursor: grab;
      transition: transform 0.2s, filter 0.2s;
      touch-action: none;
    }

    .draggable-item:hover {
      transform: scale(1.08);
    }

    .draggable-item.selected-item {
      outline: 4px dashed var(--primary-orange);
      outline-offset: 6px;
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.7);
      transform: scale(1.08);
    }

    .drop-zone {
      border: 3px dashed #ff9f1c;
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.65);
      padding: 10px;
      transition: all 0.25s ease;
      cursor: pointer;
    }

    .drop-zone.drag-over, .drop-zone:hover {
      background: #fff3b0;
      transform: scale(1.03);
      border-style: solid;
    }

    /* Matching Pairs Board */
    .match-columns {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px;
      margin-top: 10px;
    }

    .match-col {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .match-tile {
      background: #ffffff;
      border: 3px solid #cbd5e1;
      border-radius: 16px;
      padding: 12px;
      text-align: center;
      cursor: pointer;
      box-shadow: 0 4px 0 #cbd5e1;
      transition: all 0.2s;
      min-height: 74px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .match-tile.selected {
      border-color: var(--primary-orange);
      background: #fff8eb;
      box-shadow: 0 4px 0 var(--primary-orange);
      transform: scale(1.03);
    }

    .match-tile.matched {
      background: #d8f3dc;
      border-color: #40916c;
      box-shadow: 0 4px 0 #40916c;
      opacity: 0.75;
      pointer-events: none;
    }

    /* Animations */
    @keyframes popBounce {
      0% { transform: scale(1); }
      40% { transform: scale(1.12); }
      70% { transform: scale(0.96); }
      100% { transform: scale(1); }
    }

    @keyframes pandaHappyJump {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      30% { transform: translateY(-22px) rotate(-4deg); }
      60% { transform: translateY(-10px) rotate(4deg); }
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-8px); }
      50% { transform: translateX(8px); }
      75% { transform: translateX(-6px); }
    }

    @keyframes floatCloud {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }

    .panda-jump {
      animation: pandaHappyJump 0.8s ease infinite;
    }

    .cloud-float {
      animation: floatCloud 3s ease-in-out infinite;
    }

    /* ==========================================================================
       7. FEEDBACK TOAST OVERLAY (Non-blocking, Kid-friendly)
       ========================================================================== */
    .feedback-bar {
      min-height: 54px;
      margin-top: 12px;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 8px 16px;
      font-size: 1.2rem;
      font-weight: 800;
      transition: all 0.25s ease;
    }

    .feedback-neutral {
      background: transparent;
      color: var(--text-muted);
      font-size: 1rem;
      font-weight: 600;
    }

    .feedback-success {
      background: #d8f3dc;
      color: #1b4332;
      border: 3px solid #52b788;
      animation: popBounce 0.4s ease;
    }

    .feedback-retry {
      background: #fff3cd;
      color: #856404;
      border: 3px solid #ffc107;
      animation: shake 0.4s ease;
    }

    /* Start & Certificate Inputs */
    .name-input {
      width: 100%;
      max-width: 340px;
      padding: 14px 20px;
      font-size: 1.25rem;
      font-family: inherit;
      font-weight: bold;
      text-align: center;
      border: 4px solid var(--secondary-green);
      border-radius: 999px;
      outline: none;
      margin: 12px 0;
      background: #ffffff;
      color: var(--text-dark);
    }

    .name-input:focus {
      border-color: var(--primary-orange);
    }

    .cert-box {
      background: linear-gradient(135deg, #fffdf5 0%, #fff3b0 100%);
      border: 6px double #ff9f1c;
      border-radius: 24px;
      padding: 24px;
      text-align: center;
      box-shadow: 0 12px 30px rgba(255, 159, 28, 0.25);
    }

    @media (max-width: 640px) {
      .hanzi-text { font-size: 1.45rem; }
      .zh-large .hanzi-text { font-size: 1.75rem; }
      .choice-grid { grid-template-columns: 1fr; }
      .match-columns { gap: 10px; }
    }
  </style>
</head>
<body>

  <!-- TOP HEADER BAR -->
  <header class="top-bar">
    <div class="brand-badge">
      <span>🐼</span>
      <span>Little Panda’s Adventure</span>
    </div>

    <div class="chapter-pills" id="chapterPills">
      <div class="pill" id="pill-1">1. Pencil</div>
      <div class="pill" id="pill-2">2. Home</div>
      <div class="pill" id="pill-3">3. Rainbow</div>
    </div>

    <div class="controls-group">
      <button class="toggle-btn" id="pinyinToggleBtn" onclick="togglePinyin()">
        👁️ Hide Pinyin
      </button>
      <button class="toggle-btn" id="soundToggleBtn" onclick="toggleSound()">
        🔊 Sound: ON
      </button>
    </div>
  </header>

  <!-- MAIN GAME CANVAS -->
  <main class="game-container" id="gameContainer">
    <!-- Dynamic screens rendered via JavaScript -->
  </main>

  <script>
    /* ==========================================================================
       1. SOUND EFFECTS ENGINE (Web Audio API - 100% Offline, No External Files)
       ========================================================================== */
    let soundEnabled = true;
    let audioCtx = null;

    function initAudio() {
      if (!audioCtx) {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (AudioContext) audioCtx = new AudioContext();
      }
      if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    function playTone(freq, type, duration, delay = 0) {
      if (!soundEnabled) return;
      initAudio();
      if (!audioCtx) return;

      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime + delay);

      gain.gain.setValueAtTime(0.18, audioCtx.currentTime + delay);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + delay + duration);

      osc.connect(gain);
      gain.connect(audioCtx.destination);

      osc.start(audioCtx.currentTime + delay);
      osc.stop(audioCtx.currentTime + delay + duration);
    }

    function sfxClick() {
      playTone(520, 'sine', 0.08);
    }

    function sfxCorrect() {
      playTone(523.25, 'triangle', 0.14, 0);     // C5
      playTone(659.25, 'triangle', 0.14, 0.11);  // E5
      playTone(783.99, 'triangle', 0.25, 0.22);  // G5
    }

    function sfxWrong() {
      playTone(260, 'sawtooth', 0.16, 0);
      playTone(210, 'sawtooth', 0.22, 0.14);
    }

    function sfxChapterWin() {
      const notes = [523.25, 659.25, 783.99, 1046.50];
      notes.forEach((n, idx) => playTone(n, 'triangle', 0.22, idx * 0.12));
    }

    function toggleSound() {
      soundEnabled = !soundEnabled;
      const btn = document.getElementById('soundToggleBtn');
      btn.textContent = soundEnabled ? '🔊 Sound: ON' : '🔇 Sound: OFF';
      btn.classList.toggle('off', !soundEnabled);
      if (soundEnabled) sfxClick();
    }

    function togglePinyin() {
      sfxClick();
      const isHidden = document.body.classList.toggle('hide-pinyin');
      const btn = document.getElementById('pinyinToggleBtn');
      btn.textContent = isHidden ? '👁️ Show Pinyin' : '🙈 Hide Pinyin';
    }

    /* ==========================================================================
       2. CUSTOM INLINE SVG CARTOON ARTWORK LIBRARY
       ========================================================================== */
    const SVG_ART = {
      panda: (mood = 'normal', size = 140) => {
        const isSad = mood === 'sad';
        const isHappy = mood === 'happy';
        const hasPencil = mood === 'pencil';
        return `
        <svg width="${size}" height="${size}" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
          <!-- Ears -->
          <circle cx="48" cy="48" r="24" fill="#2b2d42"/>
          <circle cx="152" cy="48" r="24" fill="#2b2d42"/>
          <circle cx="48" cy="48" r="11" fill="#5c6378"/>
          <circle cx="152" cy="48" r="11" fill="#5c6378"/>
          <!-- Body -->
          <ellipse cx="100" cy="155" rx="52" ry="40" fill="#ffffff" stroke="#2b2d42" stroke-width="5"/>
          <path d="M52 135 Q100 155 148 135 L142 162 Q100 175 58 162 Z" fill="#2b2d42"/>
          <!-- Arms -->
          <ellipse cx="44" cy="145" rx="16" ry="26" transform="rotate(25 44 145)" fill="#2b2d42"/>
          <ellipse cx="156" cy="145" rx="16" ry="26" transform="rotate(-25 156 145)" fill="#2b2d42"/>
          <!-- Head -->
          <ellipse cx="100" cy="92" rx="64" ry="54" fill="#ffffff" stroke="#2b2d42" stroke-width="5"/>
          <!-- Eye Patches -->
          <ellipse cx="73" cy="88" rx="18" ry="22" transform="rotate(-18 73 88)" fill="#2b2d42"/>
          <ellipse cx="127" cy="88" rx="18" ry="22" transform="rotate(18 127 88)" fill="#2b2d42"/>
          <!-- Eyes -->
          ${isHappy || hasPencil ? `
            <path d="M64 88 Q73 76 82 88" stroke="#ffffff" stroke-width="4" fill="none" stroke-linecap="round"/>
            <path d="M118 88 Q127 76 136 88" stroke="#ffffff" stroke-width="4" fill="none" stroke-linecap="round"/>
          ` : `
            <circle cx="74" cy="86" r="7" fill="#ffffff"/>
            <circle cx="76" cy="84" r="3" fill="#2b2d42"/>
            <circle cx="126" cy="86" r="7" fill="#ffffff"/>
            <circle cx="124" cy="84" r="3" fill="#2b2d42"/>
          `}
          <!-- Cheeks -->
          <ellipse cx="55" cy="108" rx="10" ry="6" fill="#ffadad" opacity="0.85"/>
          <ellipse cx="145" cy="108" rx="10" ry="6" fill="#ffadad" opacity="0.85"/>
          <!-- Nose & Mouth -->
          <ellipse cx="100" cy="104" rx="9" ry="6" fill="#2b2d42"/>
          ${isSad ? `
            <path d="M88 124 Q100 112 112 124" stroke="#2b2d42" stroke-width="4" fill="none" stroke-linecap="round"/>
            <path d="M60 100 Q54 112 60 116 Q66 112 60 100 Z" fill="#4cc9f0"/>
          ` : isHappy || hasPencil ? `
            <path d="M84 114 Q100 134 116 114 Z" fill="#ff6b6b" stroke="#2b2d42" stroke-width="3"/>
          ` : `
            <path d="M88 115 Q100 125 112 115" stroke="#2b2d42" stroke-width="4" fill="none" stroke-linecap="round"/>
          `}
          <!-- Pencil in hand if unlocked -->
          ${hasPencil ? `
            <g transform="translate(132, 100) rotate(25)">
              <rect x="0" y="0" width="16" height="58" rx="3" fill="#ffb703" stroke="#2b2d42" stroke-width="3"/>
              <polygon points="0,58 16,58 8,74" fill="#ffe5d9" stroke="#2b2d42" stroke-width="3"/>
              <polygon points="5,68 11,68 8,74" fill="#2b2d42"/>
              <rect x="0" y="-10" width="16" height="12" rx="3" fill="#ff758f" stroke="#2b2d42" stroke-width="3"/>
            </g>
          ` : ''}
        </svg>`;
      },

      rabbit: (size = 130) => `
        <svg width="${size}" height="${size}" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
          <!-- Long Ears -->
          <ellipse cx="76" cy="48" rx="15" ry="44" transform="rotate(-10 76 48)" fill="#fff0f3" stroke="#2b2d42" stroke-width="4"/>
          <ellipse cx="76" cy="48" rx="7" ry="30" transform="rotate(-10 76 48)" fill="#ffccd5"/>
          <ellipse cx="124" cy="48" rx="15" ry="44" transform="rotate(10 124 48)" fill="#fff0f3" stroke="#2b2d42" stroke-width="4"/>
          <ellipse cx="124" cy="48" rx="7" ry="30" transform="rotate(10 124 48)" fill="#ffccd5"/>
          <!-- Body -->
          <ellipse cx="100" cy="158" rx="44" ry="36" fill="#fff0f3" stroke="#2b2d42" stroke-width="4"/>
          <path d="M64 140 L136 140 L142 182 L58 182 Z" fill="#ff758f"/>
          <!-- Head -->
          <circle cx="100" cy="105" r="48" fill="#fff0f3" stroke="#2b2d42" stroke-width="4"/>
          <!-- Eyes -->
          <circle cx="82" cy="100" r="6" fill="#2b2d42"/>
          <circle cx="84" cy="98" r="2.5" fill="#ffffff"/>
          <circle cx="118" cy="100" r="6" fill="#2b2d42"/>
          <circle cx="120" cy="98" r="2.5" fill="#ffffff"/>
          <!-- Cheeks -->
          <ellipse cx="68" cy="114" rx="8" ry="5" fill="#ff8fa3"/>
          <ellipse cx="132" cy="114" rx="8" ry="5" fill="#ff8fa3"/>
          <!-- Nose & Smile -->
          <polygon points="95,112 105,112 100,118" fill="#ff4d6d"/>
          <path d="M90 122 Q100 132 110 122" stroke="#2b2d42" stroke-width="3.5" fill="none" stroke-linecap="round"/>
        </svg>`,

      pencil: (size = 86) => `
        <svg width="${size}" height="${size}" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
          <g transform="translate(60,60) rotate(35) translate(-60,-60)">
            <rect x="46" y="14" width="28" height="16" rx="5" fill="#ff758f" stroke="#2b2d42" stroke-width="4"/>
            <rect x="46" y="28" width="28" height="10" fill="#ced4da" stroke="#2b2d42" stroke-width="4"/>

    let playerName = 'Little Explorer';

    let currentStepIndex = 0;

    let matchSelectedLeft = null;
    let matchSelectedRight = null;
    let matchedKeys = new Set();
    let cloudsClicked = 0;

    const container = document.getElementById('gameContainer');

    function updateProgressPills() {
      const step = GAME_STEPS[currentStepIndex];
      const activeChap = currentScreen === 'victory' ? 4 : (step ? step.chapter : 0);

      for (let c = 1; c <= 3; c++) {
        const pill = document.getElementById(`pill-${c}`);
        pill.classList.remove('active', 'done');
        if (currentScreen === 'start') continue;
        if (c < activeChap || currentScreen === 'victory') {
          pill.classList.add('done');
          pill.textContent = `✅ ${c}. ${c === 1 ? 'Pencil' : c === 2 ? 'Home' : 'Rainbow'}`;
        } else if (c === activeChap) {
          pill.classList.add('active');
          pill.textContent = `⭐ ${c}. ${c === 1 ? 'Pencil' : c === 2 ? 'Home' : 'Rainbow'}`;
        } else {
          pill.textContent = `${c}. ${c === 1 ? 'Pencil' : c === 2 ? 'Home' : 'Rainbow'}`;
        }
      }
    }

    function setFeedback(type, message) {
      const fb = document.getElementById('feedbackBar');
      if (!fb) return;
      fb.className = `feedback-bar feedback-${type}`;
      fb.innerHTML = message;
    }

    function advanceStep() {
      const step = GAME_STEPS[currentStepIndex];
      correctCount++;
      sfxCorrect();

      setTimeout(() => {
        if (step.chapterComplete) {
          sfxChapterWin();
          currentScreen = 'chapter-celebration';
          render();
        } else {
          currentStepIndex++;
          resetStepLocalState();
          render();
        }
      }, 1150);
    }

    function resetStepLocalState() {
      selectedTool = null;
      matchSelectedLeft = null;
      matchSelectedRight = null;
      matchedKeys = new Set();
      cloudsClicked = 0;
    }

      updateProgressPills();

      if (currentScreen === 'start') {
        renderStartScreen();
      } else if (currentScreen === 'chapter-celebration') {
        renderChapterCelebration();
      } else if (currentScreen === 'victory') {
        renderVictoryScreen();
      } else {
        renderGameStep();
      }
    }

    function startGame() {
      sfxClick();
      const input = document.getElementById('playerNameInput');

      currentStepIndex = 0;
      correctCount = 0;
      resetStepLocalState();
      currentScreen = 'play';
      render();

    // --- ACTIVE STEP SCREEN ---
    function renderGameStep() {
      const step = GAME_STEPS[currentStepIndex];

      if (step.type === 'scene-drag-pencil') {
        bodyHtml = renderSceneDragPencil(step);

        bodyHtml = renderVocabEnToZh(step);
      } else if (step.type === 'vocab-zh-to-en') {
        bodyHtml = renderVocabZhToEn(step);
      } else if (step.type === 'match-pairs') {
        bodyHtml = renderMatchPairs(step);
      } else if (step.type === 'sentence-meaning') {
        bodyHtml = renderSentenceMeaning(step);
      } else if (step.type === 'scene-find-home') {
        bodyHtml = renderSceneFindHome(step);
      } else if (step.type === 'scene-find-rainbow') {
        bodyHtml = renderSceneFindRainbow(step);

      if (step.type === 'scene-drag-pencil') {
        setupDragAndDropEvents();
      }

    function setupDragAndDropEvents() {
      const draggables = document.querySelectorAll('.draggable-item');
      const dropZone = document.getElementById('pandaDropZone');

      draggables.forEach(el => {
        el.addEventListener('dragstart', (e) => {
          selectedTool = el.getAttribute('data-item');
          e.dataTransfer.setData('text/plain', selectedTool);
        });
      });

      if (dropZone) {
        dropZone.addEventListener('dragover', (e) => {
          e.preventDefault();
          dropZone.classList.add('drag-over');
        });
        dropZone.addEventListener('dragleave', () => {
          dropZone.classList.remove('drag-over');
        });
        dropZone.addEventListener('drop', (e) => {
          e.preventDefault();
          dropZone.classList.remove('drag-over');
          const item = e.dataTransfer.getData('text/plain') || selectedTool;
          evaluatePencilDelivery(item);
        });
      }
    }

    function selectDeskItem(itemKey, el) {
      sfxClick();
      document.querySelectorAll('.draggable-item').forEach(d => d.classList.remove('selected-item'));
      el.classList.add('selected-item');
      selectedTool = itemKey;
      setFeedback('neutral', `Selected! Now click on Little Panda to give it!`);
    }

    function handleDropZoneClick() {
      if (!selectedTool) {
        sfxClick();
        setFeedback('retry', 'First tap or drag an item from Little Rabbit’s desk!');
        return;
      }
      evaluatePencilDelivery(selectedTool);
    }

    let pencilDelivered = false;
    function evaluatePencilDelivery(itemKey) {
      if (pencilDelivered) return;
      if (itemKey === 'pencil') {
        pencilDelivered = true;
        const holder = document.getElementById('pandaAvatarHolder');
        if (holder) {
          holder.innerHTML = SVG_ART.panda('pencil', 135);
          holder.classList.add('panda-jump');
        }
        setFeedback('success', '⭐ Awesome! Little Panda got the pencil (铅笔)! +1 Star!');
        setTimeout(() => { pencilDelivered = false; }, 1400);
        advanceStep();
      } else {
        sfxWrong();
        setFeedback('retry', 'Oops! Little Panda needs a pencil (铅笔). Try Again!');
      }
    }

    // --- TASK TYPE B: ENGLISH -> CHINESE ---
    function renderVocabEnToZh(step) {
      const cards = step.options.map(key => {
        const item = VOCAB_BANK[key];
        const artHtml = item.art && SVG_ART[item.art] ? `<div style="margin-bottom:6px;">${SVG_ART[item.art](68)}</div>` : '';
        return `
          <div class="choice-card" onclick="checkSimpleChoice(this, '${key === step.answer}')">
            ${artHtml}
            ${renderZh(item.zh, 'zh-large')}
          </div>
        `;
      }).join('');

      return `
        <div style="text-align:center; background:#ffffff; border-radius:20px; padding:22px; border:3px solid #e2e8f0;">
          <div style="font-size:1rem; color:#5c6378; font-weight:700;">English Meaning:</div>
          <div style="font-size:2.1rem; font-weight:900; color:#1d3557; margin-top:4px;">
            “${step.promptEn}”
          </div>
        </div>
        <div class="choice-grid">${cards}</div>
      `;
    }

    // --- TASK TYPE C: CHINESE -> ENGLISH ---
    function renderVocabZhToEn(step) {
      const promptItem = VOCAB_BANK[step.promptZh];
      const artHtml = promptItem.art && SVG_ART[promptItem.art]
        ? `<div style="margin-bottom:6px;">${SVG_ART[promptItem.art](82)}</div>`
        : '';

      const cards = step.options.map(enOpt => `
        <div class="choice-card" onclick="checkSimpleChoice(this, '${enOpt === step.answer}')">
          <div class="choice-en">${enOpt}</div>
        </div>
      `).join('');

      return `
        <div style="text-align:center; background:#ffffff; border-radius:20px; padding:22px; border:3px solid #e2e8f0;">
          ${artHtml}
          <div style="margin-top:4px;">
            ${renderZh(promptItem.zh, 'zh-large')}
          </div>
        </div>
        <div class="choice-grid">${cards}</div>
      `;
    }

    // --- TASK TYPE D: MATCHING PAIRS (Click Chinese -> Click English) ---
    function renderMatchPairs(step) {
      // Deterministic shuffle for right column so it isn't always straight across
      const leftKeys = [...step.pairs];
      const rightKeys = [...step.pairs].reverse();
      if (rightKeys.length >= 3) {
        const temp = rightKeys[0];
        rightKeys[0] = rightKeys[1];
        rightKeys[1] = temp;
      }

      const leftHtml = leftKeys.map(k => {
        const isMatched = matchedKeys.has(k);
        const isSelected = matchSelectedLeft === k;
        return `
          <div class="match-tile ${isMatched ? 'matched' : ''} ${isSelected ? 'selected' : ''}"
               onclick="selectMatchLeft('${k}')">
            ${renderZh(VOCAB_BANK[k].zh)}
          </div>
        `;
      }).join('');

      const rightHtml = rightKeys.map(k => {
        const isMatched = matchedKeys.has(k);
        const isSelected = matchSelectedRight === k;
        return `
          <div class="match-tile ${isMatched ? 'matched' : ''} ${isSelected ? 'selected' : ''}"
               onclick="selectMatchRight('${k}')">
            <span class="choice-en">${VOCAB_BANK[k].en}</span>
          </div>
        `;
      }).join('');

      return `
        <div class="match-columns">
          <div class="match-col">${leftHtml}</div>
          <div class="match-col">${rightHtml}</div>
        </div>
      `;
    }

    function selectMatchLeft(key) {
      if (matchedKeys.has(key)) return;
      sfxClick();
      matchSelectedLeft = key;
      evaluateMatchAttempt();
    }

    function selectMatchRight(key) {
      if (matchedKeys.has(key)) return;
      sfxClick();
      matchSelectedRight = key;
      evaluateMatchAttempt();
    }

    function evaluateMatchAttempt() {
      const step = GAME_STEPS[currentStepIndex];
      if (matchSelectedLeft && matchSelectedRight) {
        if (matchSelectedLeft === matchSelectedRight) {
          matchedKeys.add(matchSelectedLeft);
          matchSelectedLeft = null;
          matchSelectedRight = null;
          render();
          if (matchedKeys.size === step.pairs.length) {
            setFeedback('success', '⭐ All pairs matched! Great job!');
            advanceStep();
          } else {
            sfxCorrect();
            setFeedback('success', '⭐ Nice match! Keep going!');
          }
        } else {
          sfxWrong();
          matchSelectedLeft = null;
          matchSelectedRight = null;
          render();
          setFeedback('retry', 'Not a match! Try Again!');
        }
      } else {
        render();
      }
    }

    // --- TASK TYPE E: SENTENCE COMPREHENSION ---
    function renderSentenceMeaning(step) {
      const cards = step.options.map(opt => `
        <div class="choice-card" onclick="checkSimpleChoice(this, '${opt.correct}')">
          <div class="choice-en">${opt.text}</div>
        </div>

      return `
        <div style="display:flex; align-items:center; justify-content:center; gap:16px; background:#ffffff; border-radius:20px; padding:18px; border:3px solid #e2e8f0; flex-wrap:wrap;">

      `;
    }

    function restartGame() {
      sfxClick();
      currentStepIndex = 0;
      correctCount = 0;
      resetStepLocalState();
      currentScreen = 'start';
      render();
    }

    function escapeHtml(str) {
      return str.replace(/[&<>"']/g, m => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[m]));
    }

    // Initialize game on load
    window.onload = function() {
      render();
    };
  </script>
</body>
</html>
