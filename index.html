<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Little Panda’s Adventure — 小熊猫的奇妙一天 (Edition 2)</title>
  <style>
    /* ==========================================================================
       1. BASE & RESET (Kid-friendly, Bright, Offline-Ready)
       ========================================================================== */
    :root {
      --bg-cream: #fffdf7;
      --primary-orange: #ff9f1c;
      --primary-orange-dark: #e08200;
      --secondary-green: #2ec4b6;
      --secondary-green-dark: #1fa396;
      --accent-pink: #ff6b6b;
      --accent-yellow: #ffd166;
      --accent-purple: #7209b7;
      --text-dark: #2b2d42;
      --text-muted: #5c6378;
      --card-shadow: 0 10px 25px rgba(43, 45, 66, 0.12);
      --border-radius-lg: 24px;
      --border-radius-md: 16px;
    }

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: "Comic Sans MS", "Chalkboard SE", "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
      background: linear-gradient(180deg, #cbeeff 0%, #eaf8ff 60%, #d8f3dc 100%);
      color: var(--text-dark);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow-x: hidden;
    }

    /* ==========================================================================
       2. TOP HEADER BAR
       ========================================================================== */
    .top-bar {
      width: 100%;
      max-width: 1040px;
      padding: 12px 20px;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      z-index: 40;
    }

    .brand-badge {
      background: #ffffff;
      padding: 8px 16px;
      border-radius: 999px;
      font-weight: bold;
      font-size: 1rem;
      color: var(--text-dark);
      box-shadow: 0 4px 10px rgba(0,0,0,0.08);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .chapter-pills {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .pill {
      padding: 6px 14px;
      border-radius: 999px;
      font-size: 0.9rem;
      font-weight: bold;
      background: rgba(255, 255, 255, 0.75);
      color: var(--text-muted);
      border: 2px solid transparent;
      transition: all 0.3s ease;
    }

    .pill.active {
      background: var(--accent-yellow);
      color: var(--text-dark);
      border-color: var(--primary-orange);
      transform: scale(1.05);
    }

    .pill.done {
      background: #b7e4c7;
      color: #1b4332;
    }

    .controls-group {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .toggle-btn {
      background: #ffffff;
      border: 3px solid var(--secondary-green);
      color: var(--text-dark);
      padding: 8px 16px;
      border-radius: 999px;
      font-weight: bold;
      font-size: 0.95rem;
      cursor: pointer;
      box-shadow: 0 4px 0 var(--secondary-green-dark);
      transition: transform 0.1s, box-shadow 0.1s;
    }

    .toggle-btn:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 var(--secondary-green-dark);
    }

    .toggle-btn.off {
      border-color: #adb5bd;
      box-shadow: 0 4px 0 #6c757d;
      color: #6c757d;
    }

    /* ==========================================================================
       3. MAIN STAGE CONTAINER
       ========================================================================== */
    .game-container {
      width: 95%;
      max-width: 1000px;
      background: var(--bg-cream);
      border-radius: var(--border-radius-lg);
      box-shadow: var(--card-shadow);
      border: 5px solid #ffffff;
      padding: 20px;
      margin-bottom: 24px;
      position: relative;
      min-height: 600px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    /* ==========================================================================
       4. PINYIN + HANZI RUBY DISPLAY
       ========================================================================== */
    .zh-phrase {
      display: inline-flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: flex-end;
      gap: 4px;
      line-height: 1.25;
    }

    .zh-word {
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      margin: 0 2px;
    }

    .pinyin-text {
      font-size: 0.95rem;
      font-weight: 700;
      color: #d94e34;
      letter-spacing: 0.4px;
      min-height: 1.2em;
      transition: opacity 0.2s ease, visibility 0.2s ease;
    }

    body.hide-pinyin .pinyin-text {
      opacity: 0;
      visibility: hidden;
    }

    .hanzi-text {
      font-size: 1.75rem;
      font-weight: 800;
      color: var(--text-dark);
    }

    .zh-large .pinyin-text { font-size: 1.15rem; }
    .zh-large .hanzi-text { font-size: 2.15rem; }

    .zh-small .pinyin-text { font-size: 0.85rem; }
    .zh-small .hanzi-text { font-size: 1.35rem; }

    /* Highlighted Blank Slot in Grammar Sentences */
    .blank-slot {
      display: inline-block;
      min-width: 68px;
      padding: 2px 12px;
      margin: 0 4px;
      border-bottom: 4px solid #ff9f1c;
      background: #fff3b0;
      border-radius: 8px;
      color: #e08200;
      font-weight: 900;
      font-size: 1.6rem;
    }

    .slot-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: #e0fbfc;
      border: 3px dashed #2ec4b6;
      color: #1d3557;
      font-weight: 900;
      font-size: 1.2rem;
      padding: 4px 12px;
      border-radius: 12px;
      margin: 0 4px;
    }

    /* ==========================================================================
       5. BUTTONS & INTERACTIVE CARDS
       ========================================================================== */
    .btn-primary {
      background: linear-gradient(180deg, #ffb703 0%, #fb8500 100%);
      color: #ffffff;
      border: none;
      padding: 14px 32px;
      font-size: 1.25rem;
      font-weight: 800;
      border-radius: 999px;
      cursor: pointer;
      box-shadow: 0 6px 0 #c96200, 0 10px 20px rgba(251, 133, 0, 0.3);
      transition: transform 0.12s, box-shadow 0.12s;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .btn-primary:hover {
      filter: brightness(1.05);
    }

    .btn-primary:active {
      transform: translateY(4px);
      box-shadow: 0 2px 0 #c96200;
    }

    .choice-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 16px;
      width: 100%;
      margin-top: 14px;
    }

    .choice-card {
      background: #ffffff;
      border: 4px solid #dce8f2;
      border-radius: var(--border-radius-md);
      padding: 16px 14px;
      cursor: pointer;
      text-align: center;
      transition: all 0.2s ease;
      box-shadow: 0 5px 0 #cbd9e6;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 92px;
    }

    .choice-card:hover {
      border-color: var(--primary-orange);
      transform: translateY(-3px);
      box-shadow: 0 8px 0 #f4a261;
    }

    .choice-card:active {
      transform: translateY(2px);
      box-shadow: 0 2px 0 #cbd9e6;
    }

    .choice-card.correct {
      background: #d8f3dc;
      border-color: #2d6a4f;
      box-shadow: 0 5px 0 #2d6a4f;
      animation: popBounce 0.45s ease;
    }

    .choice-card.wrong {
      background: #ffe5ec;
      border-color: #e63946;
      box-shadow: 0 5px 0 #e63946;
      animation: shake 0.4s ease;
    }

    .choice-en {
      font-size: 1.2rem;
      font-weight: 700;
      color: var(--text-dark);
    }

    /* ==========================================================================
       6. CARTOON SCENE BACKGROUNDS & BANNERS
       ========================================================================== */
    .scene-box {
      width: 100%;
      border-radius: 20px;
      padding: 16px;
      position: relative;
      overflow: hidden;
      border: 3px solid rgba(0,0,0,0.06);
      margin-bottom: 12px;
    }

    .scene-classroom {
      background: linear-gradient(180deg, #fff3b0 0%, #ffe8a3 68%, #d4a373 68%, #bc8a5f 100%);
    }

    .scene-street {
      background: linear-gradient(180deg, #bde0fe 0%, #e0fbfc 65%, #95d5b2 65%, #74c69d 82%, #adb5bd 82%, #6c757d 100%);
    }

    .scene-sky {
      background: linear-gradient(180deg, #4cc9f0 0%, #90e0ef 55%, #caf0f8 75%, #80ed99 75%, #57cc99 100%);
    }

    .speech-bubble {
      background: #ffffff;
      border: 3px solid var(--text-dark);
      border-radius: 20px;
      padding: 12px 18px;
      position: relative;
      display: inline-block;
      box-shadow: 0 4px 10px rgba(0,0,0,0.08);
      max-width: 92%;
    }

    .instruction-banner {
      background: #edf6f9;
      border-left: 6px solid var(--secondary-green);
      padding: 10px 16px;
      border-radius: 12px;
      font-size: 1.06rem;
      font-weight: 700;
      color: #1d3557;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
    }

    .skill-tag {
      background: #7209b7;
      color: #ffffff;
      padding: 4px 12px;
      border-radius: 999px;
      font-size: 0.85rem;
      font-weight: 800;
      letter-spacing: 0.3px;
    }

    /* Drag & Drop + Click-to-Select Items */
    .draggable-item {
      cursor: grab;
      transition: transform 0.2s, filter 0.2s;
      touch-action: none;
    }

    .draggable-item:hover {
      transform: scale(1.08);
    }

    .draggable-item.selected-item {
      outline: 4px dashed var(--primary-orange);
      outline-offset: 6px;
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.7);
      transform: scale(1.08);
    }

    .drop-zone {
      border: 3px dashed #ff9f1c;
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.65);
      padding: 10px;
      transition: all 0.25s ease;
      cursor: pointer;
    }

    .drop-zone.drag-over, .drop-zone:hover {
      background: #fff3b0;
      transform: scale(1.03);
      border-style: solid;
    }

    /* Matching Pairs Board */
    .match-columns {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px;
      margin-top: 10px;
    }

    .match-col {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .match-tile {
      background: #ffffff;
      border: 3px solid #cbd5e1;
      border-radius: 16px;
      padding: 12px;
      text-align: center;
      cursor: pointer;
      box-shadow: 0 4px 0 #cbd5e1;
      transition: all 0.2s;
      min-height: 74px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .match-tile.selected {
      border-color: var(--primary-orange);
      background: #fff8eb;
      box-shadow: 0 4px 0 var(--primary-orange);
      transform: scale(1.03);
    }

    .match-tile.matched {
      background: #d8f3dc;
      border-color: #40916c;
      box-shadow: 0 4px 0 #40916c;
      opacity: 0.75;
      pointer-events: none;
    }

    /* ==========================================================================
       7. WRONG ANSWER EXPLANATION POP-UP MODAL
       ========================================================================== */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(43, 45, 66, 0.62);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 999;
      backdrop-filter: blur(3px);
    }

    .modal-backdrop.open {
      display: flex;
    }

    .explain-card {
      background: #ffffff;
      border: 6px solid #ff6b6b;
      border-radius: 28px;
      max-width: 540px;
      width: 100%;
      padding: 24px;
      text-align: center;
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.28);
      animation: popBounce 0.35s ease;
    }

    .explain-header {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin-bottom: 10px;
    }

    .explain-title {
      font-size: 1.65rem;
      font-weight: 900;
      color: #e63946;
      margin: 0;
    }

    .explain-answer-box {
      background: #d8f3dc;
      border: 3px solid #2d6a4f;
      border-radius: 18px;
      padding: 12px 16px;
      margin: 12px 0;
    }

    .explain-answer-label {
      font-size: 0.9rem;
      font-weight: 800;
      color: #1b4332;
      text-transform: uppercase;
      margin-bottom: 4px;
    }

    .explain-text {
      font-size: 1.1rem;
      line-height: 1.55;
      color: #2b2d42;
      background: #f8f9fa;
      padding: 12px 16px;
      border-radius: 14px;
      border-left: 5px solid #ff9f1c;
      text-align: left;
      margin-bottom: 18px;
    }

    /* ==========================================================================
       7B. PICTURE DICTIONARY POP-UP MODAL
       ========================================================================== */
    .dict-card {
      background: #fffdf7;
      border: 6px solid #2ec4b6;
      border-radius: 28px;
      max-width: 780px;
      width: 100%;
      max-height: 86vh;
      display: flex;
      flex-direction: column;
      padding: 20px 24px;
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.3);
      animation: popBounce 0.35s ease;
    }

    .dict-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 12px;
      border-bottom: 3px dashed #bee1e6;
      padding-bottom: 10px;
    }

    .dict-search {
      width: 100%;
      padding: 10px 16px;
      font-size: 1rem;
      font-family: inherit;
      font-weight: 700;
      border: 3px solid #cbd5e1;
      border-radius: 999px;
      outline: none;
      margin-bottom: 14px;
    }

    .dict-search:focus {
      border-color: #ff9f1c;
    }

    .dict-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(165px, 1fr));
      gap: 14px;
      overflow-y: auto;
      padding: 4px 4px 10px;
    }

    .dict-item {
      background: #ffffff;
      border: 3px solid #dce8f2;
      border-radius: 18px;
      padding: 12px 10px;
      text-align: center;
      box-shadow: 0 4px 0 #cbd9e6;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      transition: transform 0.15s;
    }

    .dict-item:hover {
      transform: translateY(-3px);
      border-color: #ff9f1c;
    }

    .dict-en {
      font-size: 0.98rem;
      font-weight: 800;
      color: #457b9d;
      margin-top: 6px;
    }

    /* ==========================================================================
       8. ANIMATIONS & FEEDBACK BAR
       ========================================================================== */
    @keyframes popBounce {
      0% { transform: scale(0.92); }
      50% { transform: scale(1.06); }
      100% { transform: scale(1); }
    }

    @keyframes pandaHappyJump {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      30% { transform: translateY(-20px) rotate(-4deg); }
      60% { transform: translateY(-8px) rotate(4deg); }
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-8px); }
      50% { transform: translateX(8px); }
      75% { transform: translateX(-6px); }
    }

    @keyframes floatCloud {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }

    .panda-jump {
      animation: pandaHappyJump 0.8s ease infinite;
    }

    .cloud-float {
      animation: floatCloud 3s ease-in-out infinite;
    }

    .feedback-bar {
      min-height: 52px;
      margin-top: 12px;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 8px 16px;
      font-size: 1.15rem;
      font-weight: 800;
      transition: all 0.25s ease;
    }

    .feedback-neutral {
      background: transparent;
      color: var(--text-muted);
      font-size: 1rem;
      font-weight: 600;
    }

    .feedback-success {
      background: #d8f3dc;
      color: #1b4332;
      border: 3px solid #52b788;
      animation: popBounce 0.4s ease;
    }

    .name-input {
      width: 100%;
      max-width: 340px;
      padding: 14px 20px;
      font-size: 1.25rem;
      font-family: inherit;
      font-weight: bold;
      text-align: center;
      border: 4px solid var(--secondary-green);
      border-radius: 999px;
      outline: none;
      margin: 12px 0;
      background: #ffffff;
      color: var(--text-dark);
    }

    .name-input:focus {
      border-color: var(--primary-orange);
    }

    .cert-box {
      background: linear-gradient(135deg, #fffdf5 0%, #fff3b0 100%);
      border: 6px double #ff9f1c;
      border-radius: 24px;
      padding: 24px;
      text-align: center;
      box-shadow: 0 12px 30px rgba(255, 159, 28, 0.25);
    }

    @media (max-width: 640px) {
      .hanzi-text { font-size: 1.45rem; }
      .zh-large .hanzi-text { font-size: 1.75rem; }
      .choice-grid { grid-template-columns: 1fr; }
      .match-columns { gap: 10px; }
    }
  </style>
</head>
<body>

  <!-- TOP HEADER BAR -->
  <header class="top-bar">
    <div style="display:flex; align-items:center; gap:8px; flex-wrap:wrap;">
      <button class="toggle-btn" style="border-color:#ff9f1c; box-shadow:0 4px 0 #e08200;" onclick="openDictModal()">
        📖 Dictionary 查字典
      </button>
      <div class="brand-badge">
        <span>🐼</span>
        <span>Little Panda’s Adventure</span>
      </div>
    </div>

    <div class="chapter-pills" id="chapterPills">
      <div class="pill" id="pill-1">1. Pencil</div>
      <div class="pill" id="pill-2">2. Home</div>
      <div class="pill" id="pill-3">3. Rainbow</div>
    </div>

    <div class="controls-group">
      <button class="toggle-btn" id="pinyinToggleBtn" onclick="togglePinyin()">
        🙈 Hide Pinyin
      </button>
      <button class="toggle-btn" id="soundToggleBtn" onclick="toggleSound()">
        🔊 Sound: ON
      </button>
    </div>
  </header>

  <!-- MAIN GAME CANVAS -->
  <main class="game-container" id="gameContainer">
    <!-- Dynamic screens rendered via JavaScript -->
  </main>

  <!-- WRONG ANSWER EXPLANATION POP-UP MODAL -->
  <div class="modal-backdrop" id="explainModal">
    <div class="explain-card">
      <div class="explain-header">
        <div id="explainPandaIcon"></div>
        <h2 class="explain-title">Oops! Not quite right!</h2>
      </div>
      <div class="explain-answer-box">
        <div class="explain-answer-label">✅ The Correct Answer Is:</div>
        <div id="explainCorrectAnswer" style="font-size:1.3rem; font-weight:900; color:#1b4332;"></div>
      </div>
      <div class="explain-text" id="explainReasonText"></div>
      <button class="btn-primary" onclick="closeExplainModal()">
        <span>💡 Got it! Try Again</span>
      </button>
    </div>
  </div>

  <!-- PICTURE DICTIONARY MODAL -->
  <div class="modal-backdrop" id="dictModal" onclick="if(event.target === this) closeDictModal()">
    <div class="dict-card">
      <div class="dict-header">
        <div style="display:flex; align-items:center; gap:10px;">
          <span style="font-size:1.8rem;">📖</span>
          <div>
            <h2 style="margin:0; font-size:1.45rem; color:#1d3557;">Little Panda’s Picture Dictionary</h2>
            <div style="font-size:0.88rem; font-weight:700; color:#5c6378;">Bonus Vocabulary Helper (查字典)</div>
          </div>
        </div>
        <button class="toggle-btn" style="border-color:#ff6b6b; box-shadow:0 4px 0 #d90429;" onclick="closeDictModal()">
          ✖ Close
        </button>
      </div>
      <input type="text" id="dictSearchInput" class="dict-search" placeholder="🔍 Search English, Pinyin, or Chinese (e.g. toy, 电脑, shuā)..." oninput="renderDictItems(this.value)" />
      <div class="dict-grid" id="dictGrid"></div>
    </div>
  </div>

  <script>
    /* ==========================================================================
       1. SOUND EFFECTS ENGINE (Web Audio API - 100% Offline)
       ========================================================================== */
    let soundEnabled = true;
    let audioCtx = null;

    function initAudio() {
      if (!audioCtx) {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (AudioContext) audioCtx = new AudioContext();
      }
      if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    function playTone(freq, type, duration, delay = 0) {
      if (!soundEnabled) return;
      initAudio();
      if (!audioCtx) return;

      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime + delay);

      gain.gain.setValueAtTime(0.16, audioCtx.currentTime + delay);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + delay + duration);

      osc.connect(gain);
      gain.connect(audioCtx.destination);

      osc.start(audioCtx.currentTime + delay);
      osc.stop(audioCtx.currentTime + delay + duration);
    }

    function sfxClick() { playTone(520, 'sine', 0.08); }
    function sfxCorrect() {
      playTone(523.25, 'triangle', 0.14, 0);
      playTone(659.25, 'triangle', 0.14, 0.11);
      playTone(783.99, 'triangle', 0.25, 0.22);
    }
    function sfxWrong() {
      playTone(260, 'sawtooth', 0.16, 0);
      playTone(210, 'sawtooth', 0.22, 0.14);
    }
    function sfxChapterWin() {
      [523.25, 659.25, 783.99, 1046.50].forEach((n, idx) => playTone(n, 'triangle', 0.22, idx * 0.12));
    }

    function toggleSound() {
      soundEnabled = !soundEnabled;
      const btn = document.getElementById('soundToggleBtn');
      btn.textContent = soundEnabled ? '🔊 Sound: ON' : '🔇 Sound: OFF';
      btn.classList.toggle('off', !soundEnabled);

    function openDictModal() {
      sfxClick();

      renderDictItems('');
      document.getElementById('dictModal').classList.add('open');
    }

      sfxClick();

    }

    function renderDictItems(query) {
      const q = (query || '').trim().toLowerCase();
      const grid = document.getElementById('dictGrid');
      if (!grid) return;

      const filtered = DICTIONARY_WORDS.filter(item => {
        const hanziStr = item.zh.map(p => p[0]).join('');
        return !q ||
          hanziStr.includes(q) ||
          item.pinyin.toLowerCase().includes(q) ||
          item.en.toLowerCase().includes(q);
      });

      if (filtered.length === 0) {
        grid.innerHTML = `<div style="grid-column:1/-1; text-align:center; padding:24px; color:#5c6378; font-weight:700;">No matching words found. Try another search!</div>`;
        return;
      }

      grid.innerHTML = filtered.map(item => `
        <div class="dict-item">
          <div style="margin-bottom:4px;">${SVG_ART[item.art] ? SVG_ART[item.art](64) : ''}</div>
          <div>${renderZh(item.zh, 'zh-small')}</div>
          <div class="dict-en">${item.en}</div>
        </div>
      `).join('');
    }

    // Helper function to render Hanzi characters with Ruby Pinyin above each character
    function renderZh(wordPairs, sizeClass = '') {
      const html = wordPairs.map(([hanzi, pinyin]) => `
        <span class="zh-word">
          <span class="pinyin-text">${pinyin}</span>
          <span class="hanzi-text">${hanzi}</span>

      return `<span class="zh-phrase ${sizeClass}">${html}</span>`;

    /* ==========================================================================
       5. GAME STATE & RENDER ENGINE
       ========================================================================== */
    let playerName = 'Little Explorer';
    let currentAdventure = 1; // 1 = Golden Trophy, 2 = Diamond Trophy, 3 = Super Sticker Pack
    let currentScreen = 'start'; // 'start' | 'play' | 'chapter-celebration' | 'victory'
    let currentStepIndex = 0;
    let correctCount = 0;
    let totalQuestionsAnswered = 0;
    let selectedTool = null;
    let cloudsClicked = 0;
    let stepLocked = false;

    const container = document.getElementById('gameContainer');

    function getSteps() {
      return ADVENTURES[currentAdventure];
    }

    function updateProgressPills() {
      const steps = getSteps();
      const step = steps[currentStepIndex];
      const activeChap = currentScreen === 'victory' ? 4 : (step ? step.chapter : 0);

      for (let c = 1; c <= 3; c++) {
        const pill = document.getElementById(`pill-${c}`);
        pill.classList.remove('active', 'done');
        const label = c === 1 ? 'Pencil' : c === 2 ? 'Home' : 'Rainbow';
        if (currentScreen === 'start') {
          pill.textContent = `${c}. ${label}`;
          continue;
        }
        if (c < activeChap || currentScreen === 'victory') {
          pill.classList.add('done');
          pill.textContent = `✅ ${c}. ${label}`;
        } else if (c === activeChap) {
          pill.classList.add('active');
          pill.textContent = `⭐ ${c}. ${label}`;
        } else {
          pill.textContent = `${c}. ${label}`;
        }
      }
    }

    function setFeedback(type, message) {
      const fb = document.getElementById('feedbackBar');
      if (!fb) return;
      fb.className = `feedback-bar feedback-${type}`;
      fb.innerHTML = message;
    }

    function openExplainModal(correctHtml, reasonText) {
      sfxWrong();
      document.getElementById('explainPandaIcon').innerHTML = SVG_ART.panda('thinking', 78);
      document.getElementById('explainCorrectAnswer').innerHTML = correctHtml;
      document.getElementById('explainReasonText').innerHTML = reasonText;
      document.getElementById('explainModal').classList.add('open');
    }

    function closeExplainModal() {
      sfxClick();
      document.getElementById('explainModal').classList.remove('open');
    }

    function advanceStep() {
      const steps = getSteps();
      const step = steps[currentStepIndex];
      const nextStep = steps[currentStepIndex + 1];
      const isChapterEnd = !nextStep || nextStep.chapter !== step.chapter;

      correctCount++;
      totalQuestionsAnswered++;
      sfxCorrect();

      setTimeout(() => {
        if (isChapterEnd) {
          sfxChapterWin();
          currentScreen = 'chapter-celebration';
          render();
        } else {
          currentStepIndex++;
          resetStepLocalState();
          render();
        }
      }, 1150);
    }

    function resetStepLocalState() {
      selectedTool = null;
      cloudsClicked = 0;
      stepLocked = false;
    }

    /* ==========================================================================
       6. SCREEN RENDERERS
       ========================================================================== */
    function render() {
      updateProgressPills();

      if (currentScreen === 'start') {
        renderStartScreen();
      } else if (currentScreen === 'chapter-celebration') {
        renderChapterCelebration();
      } else if (currentScreen === 'victory') {
        renderVictoryScreen();
      } else {
        renderGameStep();
      }
    }

    function startNextAdventure(advNum) {

    // --- ACTIVE STEP SCREEN ---

        bodyHtml = renderGrammarBlank(step);

                </div>
                <div class="draggable-item" draggable="true" data-item="book" onclick="selectDeskItem('book', this)" style="background:#fff; padding:8px; border-radius:14px; border:3px solid #2b2d42;">

              </div>

          </div>
        </div>
      `;

    function setupDragAndDropEvents() {
      const draggables = document.querySelectorAll('.draggable-item');
      const dropZone = document.getElementById('pandaDropZone');

      draggables.forEach(el => {
        el.addEventListener('dragstart', (e) => {
          selectedTool = el.getAttribute('data-item');
          e.dataTransfer.setData('text/plain', selectedTool);
        });
      });

      if (dropZone) {
        dropZone.addEventListener('dragover', (e) => {
          e.preventDefault();
          dropZone.classList.add('drag-over');
        });
        dropZone.addEventListener('dragleave', () => {
          dropZone.classList.remove('drag-over');
        });
        dropZone.addEventListener('drop', (e) => {
          e.preventDefault();
          dropZone.classList.remove('drag-over');
          const item = e.dataTransfer.getData('text/plain') || selectedTool;
          evaluatePencilDelivery(item);
        });
      }
    }

    function selectDeskItem(itemKey, el) {
      sfxClick();
      document.querySelectorAll('.draggable-item').forEach(d => d.classList.remove('selected-item'));
      el.classList.add('selected-item');
      selectedTool = itemKey;
      setFeedback('neutral', 'Selected! Now click on Little Panda to give it!');
    }

    function handleDropZoneClick() {
      if (!selectedTool) {
        sfxClick();
        openExplainModal(
          renderZh([['铅','qiān'],['笔','bǐ']]),
          'First tap or drag the <b>pencil (铅笔)</b> from Little Rabbit’s desk, then click on Little Panda!'
        );
        return;
      }
      evaluatePencilDelivery(selectedTool);
    }

    function evaluatePencilDelivery(itemKey) {
      if (stepLocked) return;
      if (itemKey === 'pencil') {
        stepLocked = true;
        const holder = document.getElementById('pandaAvatarHolder');
        if (holder) {
          holder.innerHTML = SVG_ART.panda('pencil', 130);
          holder.classList.add('panda-jump');
        }
        setFeedback('success', '⭐ Awesome! Little Panda got the pencil (铅笔)! +1 Star!');
        advanceStep();
      } else {
        openExplainModal(
          renderZh([['铅','qiān'],['笔','bǐ']]),
          'Little Panda said <b>“我没有铅笔”</b> (I don’t have a pencil). Please give Little Panda the <b>pencil (铅笔)</b>!'
        );
      }
    }

    // --- TASK B: ENGLISH -> CHINESE ---
    function renderVocabEnToZh(step) {
      const cards = step.options.map(key => {
        const item = VOCAB_BANK[key];
        return `
          <div class="choice-card" onclick="handleChoiceWithExplain(this, ${key === step.answer})">
            ${renderZh(item.zh, 'zh-large')}
          </div>
        `;
      }).join('');

      return `
        <div style="text-align:center; background:#ffffff; border-radius:20px; padding:22px; border:3px solid #e2e8f0;">
          <div style="font-size:1rem; color:#5c6378; font-weight:700;">English Meaning:</div>
          <div style="font-size:2rem; font-weight:900; color:#1d3557; margin-top:4px;">
            “${step.promptEn}”
          </div>
        </div>
        <div class="choice-grid">${cards}</div>
      `;
    }

    // --- TASK C: CHINESE -> ENGLISH ---
    function renderVocabZhToEn(step) {
      const promptItem = VOCAB_BANK[step.promptZh];
      const cards = step.options.map(enOpt => `
        <div class="choice-card" onclick="handleChoiceWithExplain(this, ${enOpt === step.answer})">
          <div class="choice-en">${enOpt}</div>
        </div>
      `).join('');

      return `
        <div style="text-align:center; background:#ffffff; border-radius:20px; padding:22px; border:3px solid #e2e8f0;">
          ${renderZh(promptItem.zh, 'zh-large')}
        </div>
        <div class="choice-grid">${cards}</div>
      `;
    }

    // --- TASK D: GRAMMAR FILL-IN-THE-BLANK ---
    function renderGrammarBlank(step) {
      const sentenceHtml = step.sentenceParts.map(part => {
        if (part.blank) {
          return `<span class="blank-slot">?</span>`;
        }
        return renderZh(part.zh, 'zh-large');
      }).join('');

      const cards = step.options.map(opt => `
        <div class="choice-card" onclick="handleChoiceWithExplain(this, ${opt.correct})">
          ${renderZh(opt.zh, 'zh-large')}
        </div>
      `).join('');

      return `
        <div style="display:flex; align-items:center; justify-content:center; gap:14px; background:#ffffff; border-radius:20px; padding:20px; border:3px solid #e2e8f0; flex-wrap:wrap;">
          ${SVG_ART.panda('normal', 88)}
          <div class="speech-bubble" style="display:flex; align-items:flex-end; flex-wrap:wrap; justify-content:center; gap:4px;">
            ${sentenceHtml}
          </div>
        </div>
        <div class="choice-grid">${cards}</div>
      `;
    }

    // --- TASK E: GRAMMAR WORD PLACEMENT (A / B / C) ---
    function renderGrammarPosition(step) {
      const slotsHtml = step.sentenceSlots.map(part => {
        if (part.slot) {
          return `<span class="slot-badge">[ ${part.slot} ]</span>`;
        }
        return renderZh(part.zh, 'zh-large');
      }).join('');

      const slotLetters = step.sentenceSlots.filter(p => p.slot).map(p => p.slot);
      const cards = slotLetters.map(letter => `
        <div class="choice-card" onclick="handleChoiceWithExplain(this, ${letter === step.correctSlot})">
          <div style="font-size:1.8rem; font-weight:900; color:#1d3557;">Position ${letter}</div>
        </div>
      `).join('');

      return `
        <div style="text-align:center; background:#ffffff; border-radius:20px; padding:18px; border:3px solid #e2e8f0;">
          <div style="margin-bottom:10px; font-weight:800; color:#5c6378;">
            Target Word: ${renderZh(step.targetWord)}
          </div>
          <div style="display:flex; align-items:center; justify-content:center; flex-wrap:wrap; gap:6px; background:#f8f9fa; padding:14px; border-radius:16px;">
            ${slotsHtml}
          </div>
        </div>
        <div class="choice-grid">${cards}</div>
      `;
    }

    // --- TASK F: DIALOGUE Q&A ---
    function renderDialogueQA(step) {
      const cards = step.options.map(opt => `
        <div class="choice-card" onclick="handleChoiceWithExplain(this, ${opt.correct})">
          ${renderZh(opt.zh)}
        </div>
      `).join('');

      return `
        <div style="display:flex; align-items:center; justify-content:center; gap:16px; background:#ffffff; border-radius:20px; padding:18px; border:3px solid #e2e8f0; flex-wrap:wrap;">
          ${SVG_ART.rabbit(92)}
          <div class="speech-bubble">
            ${renderZh(step.questionZh, 'zh-large')}
          </div>
        </div>
        <div class="choice-grid">${cards}</div>
      `;
    }

    // --- TASK G: LESSON 5 FIND PANDA'S HOME SCENE ---
    function renderSceneFindHome(step) {
      return `
        <div class="scene-box scene-street">
          <div style="display:flex; align-items:center; justify-content:center; gap:14px; flex-wrap:wrap; margin-bottom:14px;">
            <div id="streetPanda">${SVG_ART.panda('normal', 100)}</div>
            <div class="speech-bubble">
              ${renderZh(step.clueZh)}
              <div style="font-size:0.92rem; color:#457b9d; font-weight:700; margin-top:4px;">
                ${step.clueHint}
              </div>
            </div>
          </div>

          <div style="display:flex; justify-content:space-around; align-items:flex-end; flex-wrap:wrap; gap:12px;">
            <div class="choice-card" style="background:rgba(255,255,255,0.88);" onclick="checkHouseChoice(this, false)">
              ${SVG_ART.house('#4361ee', '#ffffff', false, 125)}
              <div style="font-weight:800; margin-top:4px;">House A</div>
            </div>
            <div class="choice-card" style="background:rgba(255,255,255,0.88);" onclick="checkHouseChoice(this, true)">
              ${SVG_ART.house('#ff6b6b', '#fff3b0', true, 125)}
              <div style="font-weight:800; margin-top:4px;">House B</div>
            </div>
            <div class="choice-card" style="background:rgba(255,255,255,0.88);" onclick="checkHouseChoice(this, false)">

              <div style="font-weight:800; margin-top:4px;">House C</div>
            </div>
          </div>
        </div>
      `;
    }

    function checkHouseChoice(el, isCorrect) {
      if (stepLocked) return;
      if (isCorrect) {
        stepLocked = true;
        el.classList.add('correct');
        const p = document.getElementById('streetPanda');
        if (p) {
          p.innerHTML = SVG_ART.panda('happy', 100);
          p.classList.add('panda-jump');

        setFeedback('success', '⭐ 对，那是我家！Little Panda found home!');

      } else {
        el.classList.add('wrong');
        setTimeout(() => el.classList.remove('wrong'), 500);
        openExplainModal(
          'House B (with Bamboo & Panda Sign)',
          'Little Panda said <b>“对，那是我家。”</b> (Yes, that is my house.) Look closely at <b>House B</b> — it has green bamboo and a panda face on the roof!'
        );
      }
    }

    // --- TASK H: LESSON 6 FIND THE RAINBOW SCENE ---
    function renderSceneFindRainbow() {

    function clickSkyCloud(cloudEl, cloudNum) {
      if (stepLocked || cloudEl.dataset.cleared === 'true') return;

      cloudEl.dataset.cleared = 'true';
      cloudEl.style.opacity = '0.25';
      cloudEl.style.transform = 'scale(0.8)';

      const speech = document.getElementById('skySpeech');
      if (cloudsClicked < 3) {
        sfxClick();
        if (speech) {
          speech.innerHTML = renderZh([['我','wǒ'],['什','shén'],['么','me'],['也','yě'],['没','méi'],['看','kàn'],['到','dào'],['！','']]);

        setFeedback('neutral', `Cloud ${cloudNum} moved! “我什么也没看到！” Click the remaining clouds!`);

        stepLocked = true;
        const area = document.getElementById('rainbowRevealArea');
        const panda = document.getElementById('skyPanda');
        if (area) {
          area.innerHTML = `<div style="animation: popBounce 0.6s ease;">${SVG_ART.rainbow(230)}</div>`;
        }
        if (speech) {
          speech.innerHTML = renderZh([['看','kàn'],['彩','cǎi'],['虹','hóng'],['！','']], 'zh-large');
        }
        if (panda) {
          panda.innerHTML = SVG_ART.panda('happy', 105);
          panda.classList.add('panda-jump');
        }
        setFeedback('success', '🌈 看彩虹！You found the rainbow!');
        advanceStep();
      }
    }

    // --- MULTIPLE CHOICE WITH WRONG-ANSWER EXPLANATION MODAL ---
    function handleChoiceWithExplain(cardEl, isCorrect) {
      if (stepLocked) return;
      const step = getSteps()[currentStepIndex];

      if (isCorrect) {
        stepLocked = true;
        cardEl.classList.add('correct');
        setFeedback('success', '⭐ Great job! +1 Star!');
        advanceStep();
      } else {
        cardEl.classList.add('wrong');
        setTimeout(() => cardEl.classList.remove('wrong'), 500);
        openExplainModal(step.explainAnswerHtml, step.explainText);
      }
    }

    /* ==========================================================================
       7. CHAPTER CELEBRATION & MULTI-ADVENTURE VICTORY SCREENS
       ========================================================================== */
    function renderChapterCelebration() {
      const steps = getSteps();
      const completedStep = steps[currentStepIndex];
      const chap = completedStep.chapter;
      const isLastChapterOfAdventure = currentStepIndex + 1 >= steps.length;

      const messages = {
        1: { title: `Adventure ${currentAdventure} — Lesson 4 Complete!`, subtitle: 'Little Panda mastered 铅笔, 可以, 借, and 支!', art: SVG_ART.panda('pencil', 145) },
        2: { title: `Adventure ${currentAdventure} — Lesson 5 Complete!`, subtitle: 'Little Panda mastered 那, 家, 吗, and 对!', art: SVG_ART.house('#ff6b6b', '#fff3b0', true, 145) },
        3: { title: `Adventure ${currentAdventure} — Lesson 6 Complete!`, subtitle: 'Little Panda mastered 看, 彩虹, 在哪里, and 什么也没!', art: SVG_ART.rainbow(210) }
      };
      const info = messages[chap];

      let nextBtnText = 'Next Chapter ➡️';
      if (isLastChapterOfAdventure) {
        if (currentAdventure === 1) nextBtnText = 'Claim Golden Panda Trophy 🏆';
        else if (currentAdventure === 2) nextBtnText = 'Claim Diamond Panda Trophy 💎';
        else nextBtnText = 'Claim Super Panda Sticker 🌟';
      }

      container.innerHTML = `
        <div style="text-align:center; padding: 24px 12px;">
          <div style="font-size:2.4rem;">🎉 ⭐ 🎉</div>
          <h2 style="font-size:1.95rem; color:#1d3557; margin:8px 0;">${info.title}</h2>
          <p style="font-size:1.15rem; font-weight:700; color:#2a9d8f; margin-bottom:16px;">${info.subtitle}</p>
          <div class="panda-jump" style="margin: 12px 0;">${info.art}</div>
          <div style="margin-top:20px;">
            <button class="btn-primary" onclick="continueAfterChapter()">
              <span>${nextBtnText}</span>
            </button>
          </div>
        </div>
      `;
    }

    function continueAfterChapter() {
      sfxClick();
      const steps = getSteps();
      if (currentStepIndex + 1 < steps.length) {
        currentStepIndex++;
        resetStepLocalState();
        currentScreen = 'play';
      } else {
        sfxChapterWin();
        currentScreen = 'victory';
      }
      render();
    }

    function renderVictoryScreen() {
      if (currentAdventure === 1) {
        // ADVENTURE 1 COMPLETE -> GOLDEN TROPHY + INVITE TO ADVENTURE 2!
        container.innerHTML = `
          <div class="cert-box">

              🌟 ADVENTURE 1 COMPLETE 🌟
            </div>
            <h1 style="font-size:2.1rem; color:#1d3557; margin:6px 0;">
              Congratulations, ${escapeHtml(playerName)}!
            </h1>

            <div style="display:flex; justify-content:center; align-items:center; gap:16px; flex-wrap:wrap; margin:8px 0;">
              ${SVG_ART.panda('happy', 110)}
              <div class="panda-jump">${SVG_ART.trophy(140, false)}</div>
              ${SVG_ART.rabbit(100)}
            </div>

            <div style="font-size:1.3rem; font-weight:900; color:#d97706; margin-bottom:10px;">
              🏆 Golden Panda Trophy Unlocked! 🏆
            </div>

            <div style="background:#ffffff; border-radius:16px; padding:12px 18px; max-width:520px; margin:0 auto 12px; border:2px solid #ffd166; text-align:left; font-weight:700; color:#334155;">
              <div>• Lesson 4, 5 & 6 (Adventure 1): <span style="color:#2d6a4f;">Completed ✅</span></div>
              <div>• Total Stars Earned: <span style="color:#e08200;">⭐ ${correctCount} Stars</span></div>
            </div>

            <div style="background:#fff8e1; border:3px dashed #ff9f1c; border-radius:20px; padding:14px 18px; max-width:560px; margin:0 auto 14px;">
              <div style="font-size:1.2rem; font-weight:900; color:#1d3557; margin-bottom:6px;">
                🌟 Want to earn MORE ClassDojo points? 🌟
              </div>
              <p style="margin:0 0 12px; color:#475569; font-weight:700; font-size:0.98rem;">
                Challenge <b>Adventure 2</b> with brand-new textbook questions from Lessons 4, 5 & 6 to win the <b>Diamond Panda Trophy</b>!
              </p>
              <button class="btn-primary" onclick="startNextAdventure(2)">
                <span>🚀 Start Adventure 2 (+More Dojo Points!)</span>
              </button>
            </div>

            <div>
              <button class="toggle-btn" onclick="restartGame()">🔄 Restart from Beginning</button>
            </div>
          </div>
        `;
      } else if (currentAdventure === 2) {
        // ADVENTURE 2 COMPLETE -> DIAMOND TROPHY + INVITE TO ADVENTURE 3 (FINAL STICKER)!
        container.innerHTML = `
          <div class="cert-box" style="background: linear-gradient(135deg, #f0f9ff 0%, #caf0f8 100%); border-color: #0096c7;">
            <div style="font-size:1.15rem; font-weight:900; color:#0077b6; letter-spacing:1px;">
              💎 ADVENTURE 2 COMPLETE 💎
            </div>
            <h1 style="font-size:2.1rem; color:#1d3557; margin:6px 0;">
              Amazing Work, ${escapeHtml(playerName)}!
            </h1>

            <div style="display:flex; justify-content:center; align-items:center; gap:16px; flex-wrap:wrap; margin:8px 0;">
              ${SVG_ART.panda('happy', 110)}
              <div class="panda-jump">${SVG_ART.trophy(140, true)}</div>
              ${SVG_ART.rabbit(100)}
            </div>

            <div style="font-size:1.3rem; font-weight:900; color:#0077b6; margin-bottom:10px;">
              💎 Diamond Panda Trophy Unlocked! 💎
            </div>

            <div style="background:#ffffff; border-radius:16px; padding:12px 18px; max-width:520px; margin:0 auto 12px; border:2px solid #90e0ef; text-align:left; font-weight:700; color:#334155;">
              <div>• Adventure 1 (Golden Trophy): <span style="color:#2d6a4f;">Completed ✅</span></div>
              <div>• Adventure 2 (Diamond Trophy): <span style="color:#2d6a4f;">Completed ✅</span></div>
              <div>• Total Stars Earned: <span style="color:#0077b6;">⭐ ${correctCount} Stars</span></div>
            </div>

            <div style="background:#f3e8ff; border:3px dashed #7209b7; border-radius:20px; padding:14px 18px; max-width:560px; margin:0 auto 14px;">
              <div style="font-size:1.2rem; font-weight:900; color:#5a189a; margin-bottom:6px;">
                🎁 Ready for the Final Challenge? Win a Special Sticker! 🎁
              </div>
              <p style="margin:0 0 12px; color:#475569; font-weight:700; font-size:0.98rem;">
                Complete <b>Adventure 3</b> (the final textbook questions!) to unlock the <b>Super Panda Sticker</b> and maximum ClassDojo points!
              </p>
              <button class="btn-primary" style="background: linear-gradient(180deg, #9d4edd 0%, #7209b7 100%); box-shadow: 0 6px 0 #480ca8;" onclick="startNextAdventure(3)">
                <span>🌟 Start Adventure 3 (Win Sticker!)</span>
              </button>
            </div>

            <div>
              <button class="toggle-btn" onclick="restartGame()">🔄 Restart from Beginning</button>
            </div>
          </div>
        `;
      } else {
        // ADVENTURE 3 COMPLETE -> GRAND MASTER STICKER REWARD!
        container.innerHTML = `
          <div class="cert-box" style="background: linear-gradient(135deg, #fff0f6 0%, #fff3b0 50%, #e0fbfc 100%); border-color: #ff6b6b;">
            <div style="font-size:1.15rem; font-weight:900; color:#d90429; letter-spacing:1px;">
              🎉 ALL 3 ADVENTURES MASTERED! 🎉
            </div>
            <h1 style="font-size:2.1rem; color:#1d3557; margin:6px 0;">
              Super Champion ${escapeHtml(playerName)}!
            </h1>

            <div style="display:flex; justify-content:center; align-items:center; gap:16px; flex-wrap:wrap; margin:8px 0;">
              ${SVG_ART.panda('happy', 105)}
              <div class="panda-jump">${SVG_ART.stickerPack(165)}</div>
              ${SVG_ART.rabbit(100)}
            </div>

            <div style="font-size:1.3rem; font-weight:900; color:#7209b7; margin-bottom:10px;">
              🌟 Super Panda Sticker + All Trophies Unlocked! 🌟
            </div>

            <div style="background:#ffffff; border-radius:16px; padding:12px 18px; max-width:520px; margin:0 auto 14px; border:2px solid #ffadad; text-align:left; font-weight:700; color:#334155;">
              <div>• Adventure 1 (Golden Trophy 🏆): <span style="color:#2d6a4f;">Completed ✅</span></div>
              <div>• Adventure 2 (Diamond Trophy 💎): <span style="color:#2d6a4f;">Completed ✅</span></div>
              <div>• Adventure 3 (Super Sticker 🌟): <span style="color:#2d6a4f;">Completed ✅</span></div>
              <div>• Grand Total Stars Earned: <span style="color:#d90429;">⭐ ${correctCount} / ${totalQuestionsAnswered}</span></div>
            </div>

            <div style="background:#d8f3dc; color:#1b4332; padding:10px 18px; border-radius:999px; display:inline-block; font-weight:800; font-size:1rem; margin-bottom:14px;">
              🎟️ Show your teacher to claim your Sticker & Bonus ClassDojo Points!
            </div>

            <div>
              <button class="btn-primary" onclick="restartGame()">
                <span>🔄 Play Again</span>
              </button>
            </div>
          </div>
        `;
      }
    }

    function restartGame() {
      sfxClick();
      currentAdventure = 1;
      currentStepIndex = 0;
      correctCount = 0;
      totalQuestionsAnswered = 0;
      resetStepLocalState();
      currentScreen = 'start';
      render();
    }

    function escapeHtml(str) {
      return str.replace(/[&<>"']/g, m => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[m]));
    }

    window.onload = function() {
      render();
    };
  </script>
</body>
</html>
